packages:
  - 'packages/*'
  - 'apps/*'

# Flaches node_modules statt des .pnpm-Speichers. Der Android-Build
# scheitert sonst an Windows' 260-Zeichen-Grenze: die Hash-Verzeichnisse
# unter .pnpm/ kosten rund 80 Zeichen, und RNs Codegen legt darunter noch
# einmal tief ab. Gemessen am 28.08.2026: 293 Zeichen, flach 213.
# Preis: Phantom-Dependencies werden moeglich.
nodeLinker: hoisted
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.19'
  - '@expo/inline-modules@0.1.7'
  - '@expo/local-build-cache-provider@57.0.8'
  - '@expo/log-box@57.0.4'
  - '@expo/metro-config@57.0.11'
  - '@expo/prebuild-config@57.0.15'
  - '@expo/router-server@57.0.8'
  - babel-preset-expo@57.0.9
  - expo-asset@57.0.15
  - expo-constants@57.0.15
  - expo-file-system@57.0.6
  - expo-haptics@57.0.2
  - expo-modules-autolinking@57.0.12
  - expo-modules-core@57.0.14
  - expo-modules-jsi@57.0.6
  - expo-secure-store@57.0.2
  - expo@57.0.17
